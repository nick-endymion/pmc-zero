#
# --- browser (playwright), used by BrowserFetcher to render pages that build their dom in js ---
#
# master switch. With it off the browser endpoints answer 409 instead of starting a browser, so a
# deployment that does not scrape can be left alone and no browser binaries are needed
pmc.browser.enabled=true

# false needs a desktop session to show the window in. true is the only option when the application
# runs as a windows service or in a container
pmc.browser.headless=true

# an already running browser to attach to instead of starting one, e.g. an opera the user started
# with "--remote-debugging-port=9222". Empty means start a browser of our own. This is the only way
# to scrape a page that needs a login: the cookies of that browser are the ones the scrape runs
# with. Takes precedence over executable-path
pmc.browser.cdp-endpoint=http://localhost:9222

# the browser binary to start, for a chromium based browser playwright does not ship. Only needed to
# drive such a browser with its own profile and without the debug port; playwright's own chromium
# (installed by `gradlew installPlaywrightBrowsers`) is the more reliable choice
pmc.browser.executable-path=

# a proxy for the browser, e.g. socks5://127.0.0.1:8090 to match what Downloader uses. Empty means
# direct. This is not the `withProxy` argument of Downloader, it applies to the browser itself
pmc.browser.proxy-socks=

# how long a navigation, a selector or a download may take, in milliseconds. Generous, because a
# gallery behind a slow server is exactly the case this browser was added for
pmc.browser.navigation-timeout-ms=65000

#
# --- download throttle, see DownloadThrottle ---
#
# how many seconds have to pass between the start of one downloaded file and the start of the next.
# A gallery of two hundred images is two hundred requests back to back otherwise, and a host that is
# asked that fast answers with errors or blocks the address. The gap is counted from the start of a
# download to the start of the next one, and it spans runs, so a scan started right after another one
# ended still waits out the rest of it rather than hitting the host flat out all over again. Only the
# files a scrape downloads are paced: reading a page, and an import that downloads a handful of
# pictures by hand, are left as they are
#
# 0 switches the throttle off, which is the default and what every deployment did before this existed
pmc.download.throttle-seconds=5

#
# --- page throttle, see PageThrottle ---
#
# how many seconds have to pass between the start of one page a scraper fetches for itself and the start
# of the next, i.e. between the pages behind the links a scraper followed rather than between the files
# it downloads. A scraper like "Gallery Index Lister" reads a whole index and then every page behind it
# back to back, and a host asked that fast answers with errors or blocks the address, which on an index
# means every page rather than one of them. Counted the same way as the download throttle above, from
# the start of one page to the start of the next and across runs, so a scan started right after another
# one ended still waits out the rest of it
#
# a separate setting from the download throttle rather than another value of it: a page and a picture are
# different requests to the same host, and a deployment that wants its files kept 5s apart does not
# thereby want its pages kept 5s apart. A page is also the bigger request of the two and there are far
# fewer of them, so this is usually the smaller of the two intervals. The page a scan is handed is
# rendered before the run starts and is not paced by this, it is fetched once per run rather than once
# per element
#
# 0 switches the throttle off, which is the default and what every deployment did before this existed
pmc.page.throttle-seconds=4
