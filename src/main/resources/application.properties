#
# --- browser (playwright), used by BrowserFetcher to render pages that build their dom in js ---
#
# master switch. With it off the browser endpoints answer 409 instead of starting a browser, so a
# deployment that does not scrape can be left alone and no browser binaries are needed
pmc.browser.enabled=true

# false needs a desktop session to show the window in. true is the only option when the application
# runs as a windows service or in a container
pmc.browser.headless=true

# an already running browser to attach to instead of starting one, e.g. an opera the user started
# with "--remote-debugging-port=9222". Empty means start a browser of our own. This is the only way
# to scrape a page that needs a login: the cookies of that browser are the ones the scrape runs
# with. Takes precedence over executable-path
pmc.browser.cdp-endpoint=http://localhost:9222

# the browser binary to start, for a chromium based browser playwright does not ship. Only needed to
# drive such a browser with its own profile and without the debug port; playwright's own chromium
# (installed by `gradlew installPlaywrightBrowsers`) is the more reliable choice
pmc.browser.executable-path=

# a proxy for the browser, e.g. socks5://127.0.0.1:8090 to match what Downloader uses. Empty means
# direct. This is not the `withProxy` argument of Downloader, it applies to the browser itself
pmc.browser.proxy-socks=

# how long a navigation, a selector or a download may take, in milliseconds. Generous, because a
# gallery behind a slow server is exactly the case this browser was added for
pmc.browser.navigation-timeout-ms=45000
